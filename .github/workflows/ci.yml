name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Business tests
        run: npm test

      - name: Database permissions and checkout
        run: npm run test:database

      - name: Lint
        run: npm run lint

      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance and production build
        run: npm run test:browser
